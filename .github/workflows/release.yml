name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (for example v0.13.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: MaidTendouAris/Muxivra
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable tag and version
        run: |
          if ($env:GITHUB_REPOSITORY -ne $env:GH_REPO) { throw 'Release publication is restricted to the official repository.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Only stable vMAJOR.MINOR.PATCH tags are supported.' }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") { throw 'The tag must match package.json.' }
          $sharedVersion = [regex]::Match((Get-Content src/shared/version.ts -Raw), "APP_VERSION\s*=\s*['`"]([^'`"]+)['`"]").Groups[1].Value
          if ($sharedVersion -ne $packageVersion) { throw 'APP_VERSION must match package.json.' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must already exist.' }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          $buildCommit = git rev-parse HEAD
          if ($tagCommit -ne $buildCommit) { throw 'The checkout must match the tagged commit.' }

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install locked dependencies
        run: |
          npm install --global npm@11
          if ($LASTEXITCODE -ne 0) { throw 'npm preparation failed.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Run unit tests
        run: npm test

      - name: Build Windows x64 installer
        run: npm run package:win

      - name: Verify package and archive source
        env:
          MUXIVRA_PACKAGE_DIR: release/win-unpacked
          MUXIVRA_RELEASE_DIR: release
        run: |
          node scripts/package-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed.' }
          node scripts/installer-preservation-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer preservation verification failed.' }
          & ./scripts/source-archive.ps1

      - name: Prepare release checksums
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseNames = @("Muxivra-$version-win-x64-setup.exe", "Muxivra-$version-win-x64-setup.exe.blockmap", 'latest.yml', "Muxivra-$version-source.zip")
          $lines = foreach ($name in $releaseNames) {
            $asset = Join-Path 'release' $name
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $name" }
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
            release/*-source.zip
            release/SHA256SUMS.txt
            artifacts/qa/package-contents.json
            artifacts/qa/installer-preservation-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existingJson = gh api --paginate --slurp 'repos/MaidTendouAris/Muxivra/releases?per_page=100'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing releases; nothing will be published.' }
          $existing = $existingJson | ConvertFrom-Json
          if (@($existing | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }).Count -gt 0) { throw 'A release already exists for this tag. Assets will not be overwritten.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @("release/Muxivra-$version-win-x64-setup.exe", "release/Muxivra-$version-win-x64-setup.exe.blockmap", 'release/latest.yml', "release/Muxivra-$version-source.zip", 'release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Muxivra $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; the release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; check the draft in GitHub.' }
