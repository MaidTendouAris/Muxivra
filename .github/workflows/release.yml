name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag, for example v0.25.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}

  publish:
    needs: build
    if: github.repository == 'MaidTendouAris/Muxivra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: MaidTendouAris/Muxivra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: distribution

      - name: Publish verified files atomically through a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          installer="Muxivra-$VERSION-win-x64-setup.exe"
          portable="Muxivra-$VERSION-win-x64-portable.zip"
          test -s "distribution/$installer"
          test -s "distribution/$portable"
          test -s distribution/latest.yml
          test "$(find distribution -type f | wc -l)" -eq 3
          # Read all release pages, including drafts; API errors stop publication.
          existing=$(gh api --paginate 'repos/{owner}/{repo}/releases?per_page=100' --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if [[ -n "$existing" ]]; then
            echo 'A release already exists for this tag. Nothing will be overwritten.' >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          Windows x64 downloads:
          - **$portable** — extract the complete folder and run Muxivra.exe; no installation required.
          - **$installer** — installer with shortcuts and application updates.

          The latest.yml attachment is required by the application's update checker.
          Builds are currently unsigned. FFmpeg and ASR models can be downloaded separately inside the app.
          EOF
          if [[ -f "docs/RELEASE-$VERSION.md" ]]; then
            cat "docs/RELEASE-$VERSION.md" > feature-notes.md
            printf '\n\n' >> feature-notes.md
            cat release-notes.md >> feature-notes.md
            mv feature-notes.md release-notes.md
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Muxivra $VERSION" --notes-file release-notes.md --generate-notes
          gh release upload "$RELEASE_TAG" "distribution/$installer" "distribution/$portable" distribution/latest.yml
          # Confirm all uploaded files before making the release public.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > uploaded.txt
          printf '%s\n' "$installer" "$portable" latest.yml | sort > expected.txt
          diff -u expected.txt uploaded.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
