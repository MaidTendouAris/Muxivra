appId: dev.muxivra.desktop
productName: Muxivra
afterPack: scripts/prepare-installer-manifest.cjs
electronUpdaterCompatibility: ">=2.16"
publish:
  provider: github
  owner: MaidTendouAris
  repo: Muxivra
  releaseType: release
  tagNamePrefix: v
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.txt
  - resources/icon.png
  - resources/icon.ico
  - resources/mcp-skills/**/*
asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
extraResources:
  - from: resources/asr
    to: asr
    filter:
      - '*.py'
      - '*.json'
      - '*.md'
  - from: resources/mpv
    to: mpv
    filter:
      - mpv.exe
      - LICENSE*
      - COPYRIGHT*
      - SOURCES*
  - from: resources/mpv-licenses
    to: mpv/licenses
  - from: resources/mpv-manifest.json
    to: mpv-manifest.json
  - from: resources/mpv-input.conf
    to: mpv-input.conf
win:
  target:
    - nsis
    - zip
  icon: resources/icon.ico
  executableName: Muxivra
  signExecutable: false
nsis:
  artifactName: Muxivra-${version}-win-${arch}-setup.${ext}
  include: resources/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: LICENSE
  deleteAppDataOnUninstall: false
artifactName: Muxivra-${version}-win-${arch}-portable.${ext}
